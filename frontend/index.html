    <title>Gameplan</title>
    <!--
      Apply the saved theme synchronously, before first paint, so the WebView
      never flashes white between the splash screen and Vue mounting. Setting
      data-theme alone is not enough: the bg-surface-base class only resolves
      once the Tailwind bundle loads, so we also paint an explicit background
      color matching the app chrome (#ffffff / #111111) directly on <html>.
      Mirrors the resolution logic in src/utils/useTheme.ts.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : null
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#111111' : '#ffffff'
        } catch (e) {}
      })()
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111" />
