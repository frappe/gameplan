name: Server Test Coverage Report

# Runs after "Server Tests" completes. Triggered by workflow_run, it executes in the
# base-repo (trusted) context with a read-write token, so it can post the coverage
# comment even when the run came from a fork PR — where the test workflow's own token
# is read-only and cannot comment.
on:
  workflow_run:
    workflows: ["Server Tests"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    # Fork PRs only — same-repo PRs comment inline from server-tests.yml, so skipping
    # them here avoids a duplicate comment. (head_repository differs from the base
    # repo only when the run originated from a fork.)
    if: >-
      github.event.workflow_run.conclusion != 'skipped'
      && github.repository_owner == 'frappe'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name != github.repository
    steps:
      # Checks out the default branch (trusted), not the fork PR code — we only need
      # the report script here, never the untrusted branch under test.
      - name: Checkout report script
        uses: actions/checkout@v4

      - name: Download artifacts from test run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts

      # Resolved from head_sha (trusted — it comes from the workflow_run event, not
      # from the run's artifacts) via the API. Reading the number out of an uploaded
      # event.json instead would let a fork name any PR in the repo and have this
      # write-authorized token comment on it.
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          number="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")] | .[0].number // empty')"
          if [ -z "$number" ]; then
            echo "No open pull request for ${HEAD_SHA}; nothing to comment on."
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # The XML is fork-controlled, so the script caps its size and refuses a DTD.
      - name: Build markdown report
        if: ${{ steps.pr.outputs.number != '' }}
        run: python .github/scripts/coverage_report.py artifacts/backend-coverage/coverage.xml --markdown "$RUNNER_TEMP/coverage.md"

      - name: Comment coverage on PR (fork)
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ steps.pr.outputs.number != '' }}
        with:
          header: backend-coverage
          number: ${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/coverage.md
