name: Server Tests

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'frappe' }}
    timeout-minutes: 60

    # contents: write pushes the regenerated README badge on develop;
    # pull-requests: write posts the coverage comment. Fork pull requests get a
    # read-only token regardless, which is why the comment step is best-effort
    # and the job summary always carries the same report.
    permissions:
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false

    name: Python Unit Tests

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: 123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - uses: actions/setup-node@v3
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: |
          echo "127.0.0.1 gameplan.test" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install Dependencies
        run: |
          bash ${GITHUB_WORKSPACE}/.github/helper/install_dependencies.sh
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          BEFORE: ${{ env.GITHUB_EVENT_PATH.before }}
          AFTER: ${{ env.GITHUB_EVENT_PATH.after }}

      # Neither is in a fresh bench env: frappe.coverage imports `coverage` (without it
      # the --coverage run dies before a single test), and unittest-xml-reporting is
      # only in frappe's optional `test` extra. Missing xmlrunner is not fatal — frappe
      # falls back to the plain runner — but the report would then lose the list of
      # which tests failed, which is the point of collecting it.
      - name: Install coverage and JUnit reporting
        run: ~/frappe-bench/env/bin/pip install coverage unittest-xml-reporting

      # The JUnit XML is what lets the PR comment name the tests that failed instead
      # of just linking to the log.
      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site gameplan.test run-tests --app gameplan --coverage \
            --junit-xml-output "${RUNNER_TEMP}/backend-junit.xml"

      # Reporting, not a gate: if a report cannot be produced, say so rather than
      # reddening a suite that passed. Results and coverage are one section of a
      # single PR comment shared with the UI job — see .github/scripts/pr_comment.py.
      - name: Build backend report
        id: report
        if: ${{ always() }}
        run: |
          python .github/scripts/junit_to_markdown.py "${RUNNER_TEMP}/backend-junit.xml" \
            --label Backend --kind module \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${RUNNER_TEMP}/backend-section.md"

          if python .github/scripts/coverage_report.py ~/frappe-bench/sites/coverage.xml \
              --markdown "${RUNNER_TEMP}/coverage-part.md" \
              --badge "${RUNNER_TEMP}/coverage.svg" --compact; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            printf '\n' >> "${RUNNER_TEMP}/backend-section.md"
            cat "${RUNNER_TEMP}/coverage-part.md" >> "${RUNNER_TEMP}/backend-section.md"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            printf '\nBackend coverage was unavailable for this run.\n' >> "${RUNNER_TEMP}/backend-section.md"
          fi
          cat "${RUNNER_TEMP}/backend-section.md" >> "$GITHUB_STEP_SUMMARY"

      # Same-repo PRs have a read-write token, so write directly here. Fork PRs
      # (read-only token) are handled by server-tests-report.yml from the artifacts
      # below — hence the same-repo-only guard.
      - name: Comment on PR (same-repo)
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/pr_comment.py \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section backend \
            --body-file "${RUNNER_TEMP}/backend-section.md" \
            --footer "<sub>Updated for commit ${{ github.event.pull_request.head.sha }}.</sub>"

      # Uploaded for the workflow_run reporter (fork PRs), which re-renders both in
      # the trusted context. Deliberately the only artifacts: that job resolves the
      # PR to comment on from the event's head_sha, never from anything uploaded here.
      # Staged into one directory first: upload-artifact roots a multi-path artifact at
      # the least common ancestor of those paths, which for a bench path and a runner
      # temp path is /home/runner — so the reporter would have to know both absolute
      # layouts. A flat directory keeps the artifact's shape stable.
      - name: Stage backend results
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/backend-results"
          cp ~/frappe-bench/sites/coverage.xml "${RUNNER_TEMP}/backend-results/" || true
          cp "${RUNNER_TEMP}/backend-junit.xml" "${RUNNER_TEMP}/backend-results/" || true

      - name: Upload backend results
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'pull_request' }}
        with:
          name: backend-results
          path: ${{ runner.temp }}/backend-results
          if-no-files-found: warn
          retention-days: 7

      - name: Publish coverage badge
        if: ${{ steps.report.outputs.built == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish_badge.sh "${RUNNER_TEMP}/coverage.svg" badges-backend

      - name: Stop server
        if: ${{ always() }}
        run: |
          ps -ef | grep "[f]rappe serve" | awk '{print $2}' | xargs kill -s SIGINT || true
          sleep 5

      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true
