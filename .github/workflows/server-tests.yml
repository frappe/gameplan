name: Server Tests

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'frappe' }}
    timeout-minutes: 60

    # Stays contents: read. This job checks out and executes pull-request code, so
    # a repo-write token here would be a write credential handed to code under
    # review. Badge publishing needs that token, so it lives in the push-only
    # `badge` job below and this one just hands the rendered SVG over as an
    # artifact. Fork pull requests get a read-only token regardless, which is why
    # the comment step is best-effort and the job summary always carries the report.
    permissions:
      contents: read
      pull-requests: write

    outputs:
      badge: ${{ steps.report.outputs.built }}

    strategy:
      fail-fast: false

    name: Python Unit Tests

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: 123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: |
          echo "127.0.0.1 gameplan.test" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install
        run: |
          bash "$GITHUB_WORKSPACE/.github/helper/install_dependencies.sh"
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh -s -- --ci
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch develop
          pilot -b frappe-bench set-bench-config python 3.14
          pilot -b frappe-bench set-bench-config watch_apps_js false
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          pilot -b frappe-bench set-bench-config mariadb_existing true
          pilot -b frappe-bench set-bench-config mariadb_host 127.0.0.1
          pilot -b frappe-bench set-bench-config mariadb_port 3306
          pilot -b frappe-bench set-bench-config mariadb_admin_user root
          pilot -b frappe-bench set-bench-config mariadb_password 123
          pilot -b frappe-bench init
          cd "$HOME/pilot/benches/frappe-bench"
          printf '[client]\nskip-ssl\n' > "$HOME/.my.cnf"
          mariadb -h 127.0.0.1 -u root -p123 -e "SET GLOBAL character_set_server = 'utf8mb4', GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
          uv pip install --python env/bin/python coverage unittest-xml-reporting
          printf 'loadmodule %s/.github/helper/redisearch.so\n' "$GITHUB_WORKSPACE" >> config/redis_cache.conf
          chmod +x "$GITHUB_WORKSPACE/.github/helper/redisearch.so"
          pilot start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7000/api/v1/health
          pilot new-site gameplan.test --admin-password admin --apps gameplan --skip-assets
          jq -n --slurpfile settings "$GITHUB_WORKSPACE/.github/helper/site_config.json" \
            '$settings[0] | del(.db_host, .db_port, .db_name, .db_password, .db_type) + input' \
            sites/gameplan.test/site_config.json > sites/gameplan.test/pilot-ci-config.json
          mv sites/gameplan.test/pilot-ci-config.json sites/gameplan.test/site_config.json
          pilot build --apps frappe
          pilot build --apps gameplan --force
          pilot frappe --site gameplan.test execute gameplan.search_sqlite.rebuild_index

      - name: Run Tests
        run: |
          pilot -b frappe-bench frappe --site gameplan.test run-tests --app gameplan --coverage \
            --junit-xml-output "${RUNNER_TEMP}/backend-junit.xml"

      # Reporting, not a gate: if a report cannot be produced, say so rather than
      # reddening a suite that passed. Results and coverage are one section of a
      # single PR comment shared with the UI job — see .github/scripts/pr_comment.py.
      - name: Build backend report
        id: report
        if: ${{ always() }}
        run: |
          python .github/scripts/junit_to_markdown.py "${RUNNER_TEMP}/backend-junit.xml" \
            --label Backend --kind module \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${RUNNER_TEMP}/backend-section.md"

          if python .github/scripts/coverage_report.py ~/pilot/benches/frappe-bench/sites/coverage.xml \
              --markdown "${RUNNER_TEMP}/coverage-part.md" \
              --badge "${RUNNER_TEMP}/coverage.svg" --compact; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            printf '\n' >> "${RUNNER_TEMP}/backend-section.md"
            cat "${RUNNER_TEMP}/coverage-part.md" >> "${RUNNER_TEMP}/backend-section.md"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            printf '\nBackend coverage was unavailable for this run.\n' >> "${RUNNER_TEMP}/backend-section.md"
          fi
          cat "${RUNNER_TEMP}/backend-section.md" >> "$GITHUB_STEP_SUMMARY"

      # Same-repo PRs have a read-write token, so write directly here. Fork PRs
      # (read-only token) are handled by server-tests-report.yml from the artifacts
      # below — hence the same-repo-only guard.
      - name: Comment on PR (same-repo)
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/pr_comment.py \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section backend \
            --body-file "${RUNNER_TEMP}/backend-section.md" \
            --footer "<sub>Updated for commit ${{ github.event.pull_request.head.sha }}.</sub>"

      # Uploaded for the workflow_run reporter (fork PRs), which re-renders both in
      # the trusted context. Deliberately the only artifacts: that job resolves the
      # PR to comment on from the event's head_sha, never from anything uploaded here.
      # Staged into one directory first: upload-artifact roots a multi-path artifact at
      # the least common ancestor of those paths, which for a bench path and a runner
      # temp path is /home/runner — so the reporter would have to know both absolute
      # layouts. A flat directory keeps the artifact's shape stable.
      - name: Stage backend results
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/backend-results"
          cp ~/pilot/benches/frappe-bench/sites/coverage.xml "${RUNNER_TEMP}/backend-results/" || true
          cp "${RUNNER_TEMP}/backend-junit.xml" "${RUNNER_TEMP}/backend-results/" || true

      - name: Upload backend results
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'pull_request' }}
        with:
          name: backend-results
          path: ${{ runner.temp }}/backend-results
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        if: ${{ steps.report.outputs.built == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        with:
          name: backend-badge
          path: ${{ runner.temp }}/coverage.svg
          retention-days: 1

      - name: Show Pilot output
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/pilot.log"

      - name: Stop Pilot
        if: ${{ always() }}
        run: ~/pilot/bin/pilot -b frappe-bench stop || true

  # Separated from the test job on purpose — see the permissions comment above.
  # Publishing needs contents: write, and the test job runs pull-request code.
  # This job runs only on a push to develop, where the code is already merged.
  badge:
    name: Publish coverage badge
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.outputs.badge == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-badge
          path: badge

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish_badge.sh badge/coverage.svg badges-backend
