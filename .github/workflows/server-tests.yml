name: Server Tests

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'frappe' }}
    timeout-minutes: 60

    # contents: write pushes the regenerated README badge on develop;
    # pull-requests: write posts the coverage comment. Fork pull requests get a
    # read-only token regardless, which is why the comment step is best-effort
    # and the job summary always carries the same report.
    permissions:
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false

    name: Python Unit Tests

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: 123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - uses: actions/setup-node@v3
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: |
          echo "127.0.0.1 gameplan.test" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install Dependencies
        run: |
          bash ${GITHUB_WORKSPACE}/.github/helper/install_dependencies.sh
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          BEFORE: ${{ env.GITHUB_EVENT_PATH.before }}
          AFTER: ${{ env.GITHUB_EVENT_PATH.after }}

      # frappe.coverage imports `coverage` from the bench env, which a fresh bench does
      # not install. Without this the --coverage run below dies before a single test.
      - name: Install coverage
        run: ~/frappe-bench/env/bin/pip install coverage

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site gameplan.test run-tests --app gameplan --coverage

      # Coverage is reporting, not a gate: if the report cannot be produced, say so
      # rather than reddening a suite that passed.
      - name: Build coverage report
        id: coverage
        if: ${{ always() }}
        run: |
          if python .github/scripts/coverage_report.py ~/frappe-bench/sites/coverage.xml \
              --markdown "${RUNNER_TEMP}/coverage.md" \
              --badge "${RUNNER_TEMP}/coverage.svg"; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            cat "${RUNNER_TEMP}/coverage.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "Backend coverage report unavailable for this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Same-repo PRs have a read-write token, so comment directly here. Fork PRs
      # (read-only token) are handled by server-tests-report.yml, which consumes the
      # artifacts uploaded below — hence the same-repo-only guard.
      - name: Comment coverage on PR (same-repo)
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ always() && steps.coverage.outputs.built == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          header: backend-coverage
          path: ${{ runner.temp }}/coverage.md

      # Uploaded for the workflow_run reporter (fork PRs), which re-renders it in the
      # trusted context. Deliberately the only artifact: that job resolves the PR to
      # comment on from the event's head_sha, never from anything uploaded here.
      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'pull_request' }}
        with:
          name: backend-coverage
          path: /home/runner/frappe-bench/sites/coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Publish coverage badge
        if: ${{ steps.coverage.outputs.built == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish_badge.sh "${RUNNER_TEMP}/coverage.svg" badges-backend

      - name: Stop server
        if: ${{ always() }}
        run: |
          ps -ef | grep "[f]rappe serve" | awk '{print $2}' | xargs kill -s SIGINT || true
          sleep 5

      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true
