name: Gameplan SQLite vs MariaDB
on:
  push:
    branches: [ci/pilot-benchmark]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'frappe' }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        database: [mariadb, sqlite]

    name: Pilot (${{ matrix.database }})

    services:
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10.6' || '' }}
        env:
          MARIADB_ROOT_PASSWORD: 123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: |
          echo "127.0.0.1 gameplan.test" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install
        env:
          DB: ${{ matrix.database }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server mariadb-client libmariadb-dev libcups2-dev
          curl -fsSL https://raw.githubusercontent.com/frappe/wkhtmltopdf/master/wkhtmltox-0.12.3_linux-generic-amd64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/wkhtmltox/bin/wkhtmltopdf" /usr/local/bin/wkhtmltopdf
          mkdir -p "$HOME/pilot"
          curl -fsSL https://github.com/frappe/pilot/releases/download/v1.0.0-rc.5/pilot.tar.gz | tar -xz -C "$HOME/pilot"
          command -v uv >/dev/null || curl -fsSL https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch develop --database "$DB"
          pilot -b frappe-bench set-bench-config python 3.14
          pilot -b frappe-bench set-bench-config watch_apps_js false
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          if [ "$DB" = mariadb ]; then
            pilot -b frappe-bench set-bench-config mariadb_existing true
            pilot -b frappe-bench set-bench-config mariadb_host 127.0.0.1
            pilot -b frappe-bench set-bench-config mariadb_port 3306
            pilot -b frappe-bench set-bench-config mariadb_admin_user root
            pilot -b frappe-bench set-bench-config mariadb_password 123
          fi
          pilot -b frappe-bench init --skip-frontend
          cd "$HOME/pilot/benches/frappe-bench"
          if [ "$DB" = mariadb ]; then
            printf '[client]\nskip-ssl\n' > "$HOME/.my.cnf"
            mariadb -h 127.0.0.1 -u root -p123 -e "SET GLOBAL character_set_server = 'utf8mb4', GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          fi
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
          uv pip install --python env/bin/python coverage unittest-xml-reporting
          printf 'loadmodule %s/.github/helper/redisearch.so\n' "$GITHUB_WORKSPACE" >> config/redis_cache.conf
          chmod +x "$GITHUB_WORKSPACE/.github/helper/redisearch.so"
          redis-server config/redis_cache.conf --daemonize yes
          redis-server config/redis_queue.conf --daemonize yes
          read -r cache_port queue_port < <(python -c 'import tomllib; r = tomllib.load(open("bench.toml", "rb"))["redis"]; print(r["cache_port"], r["queue_port"])')
          for port in "$cache_port" "$queue_port"; do
            redis-cli -p "$port" ping | grep -qx PONG
          done
          pilot new-site gameplan.test --admin-password admin --apps gameplan --skip-assets
          jq -n --slurpfile settings "$GITHUB_WORKSPACE/.github/helper/site_config.json" \
            '$settings[0] | del(.db_host, .db_port, .db_name, .db_password, .db_type, .root_login, .root_password) + input' \
            sites/gameplan.test/site_config.json > sites/gameplan.test/pilot-ci-config.json
          mv sites/gameplan.test/pilot-ci-config.json sites/gameplan.test/site_config.json
          pilot build --apps frappe
          pilot build --apps gameplan --force
          pilot frappe --site gameplan.test execute gameplan.search_sqlite.rebuild_index

      - name: Run Tests
        run: |
          pilot -b frappe-bench frappe --site gameplan.test run-tests --app gameplan --coverage \
            --junit-xml-output "${RUNNER_TEMP}/backend-junit.xml"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.database }}
          path: ${{ runner.temp }}/backend-junit.xml

